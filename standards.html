<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Standards Correlator · Grades 6–8 | The Calculated Classroom</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1e3a5f;--navy-dk:#12263f;--navy-lt:#e8edf5;
  --amber:#f59e0b;--amber-dk:#c47f0a;--amber-lt:#fef3c7;
  --text:#111827;--muted:#6b7280;--radius:10px;
  --rp:#7c3aed;--ns:#2563eb;--ee:#16a34a;--geo:#ea580c;--sp:#db2777;--fn:#0891b2;
  --FL:#1d4ed8;--TX:#b91c1c;--CA:#b45309;--NY:#047857;
}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);background:#f8fafc;font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:var(--navy-dk);border-bottom:3px solid var(--amber);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.nav-brand{display:flex;flex-direction:column;line-height:1.2;margin-right:8px}
.nav-sub{font-size:.55rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.nav-name{font-size:.9rem;font-weight:700;color:#fff}
.nav-title{color:rgba(255,255,255,.85);font-size:.95rem;font-weight:600;flex:1}
.nav-back{color:rgba(255,255,255,.6);font-size:.8rem;padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.2);transition:all .15s}
.nav-back:hover{color:#fff;background:rgba(255,255,255,.1)}

/* SEARCH + CONTROLS */
.controls{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;position:sticky;top:55px;z-index:90}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:340px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none}
#searchInput{width:100%;padding:8px 12px 8px 34px;border:1.5px solid #d1d5db;border-radius:8px;font-size:.88rem;outline:none;transition:border .15s}
#searchInput:focus{border-color:var(--amber)}
.grade-pills{display:flex;gap:4px}
.pill{padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer;border:1.5px solid #d1d5db;background:#fff;color:var(--muted);transition:all .15s}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.state-toggles{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.state-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .15s;user-select:none}
.state-btn.FL{border-color:var(--FL);color:var(--FL)}
.state-btn.TX{border-color:var(--TX);color:var(--TX)}
.state-btn.CA{border-color:var(--CA);color:var(--CA)}
.state-btn.NY{border-color:var(--NY);color:var(--NY)}
.state-btn.active.FL{background:var(--FL);color:#fff}
.state-btn.active.TX{background:var(--TX);color:#fff}
.state-btn.active.CA{background:var(--CA);color:#fff}
.state-btn.active.NY{background:var(--NY);color:#fff}
.toggle-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.4;transition:opacity .15s}
.state-btn.active .toggle-dot{opacity:1;background:#fff}
#resultCount{font-size:.8rem;color:var(--muted);padding:4px 0;white-space:nowrap}

/* LAYOUT */
.page{display:flex;min-height:calc(100vh - 110px)}
.sidebar{width:220px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;padding:16px 0;position:sticky;top:110px;height:calc(100vh - 110px);overflow-y:auto}
.sb-section{margin-bottom:4px}
.sb-grade{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 16px 4px;margin-top:8px}
.sb-domain{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:.82rem;font-weight:500;color:var(--text);cursor:pointer;transition:background .1s;border-radius:0}
.sb-domain:hover{background:#f3f4f6}
.sb-domain.active{background:var(--navy-lt);color:var(--navy);font-weight:700}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-count{margin-left:auto;font-size:.7rem;color:var(--muted);background:#f3f4f6;padding:1px 6px;border-radius:10px}

/* MAIN */
main{flex:1;padding:20px;min-width:0}
.domain-section{margin-bottom:32px}
.domain-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #e5e7eb}
.domain-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.domain-name{font-size:1.05rem;font-weight:700;color:var(--text)}
.domain-grade{font-size:.72rem;font-weight:700;color:var(--muted);background:#f3f4f6;padding:2px 8px;border-radius:10px}
.cluster-label{font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:10px;margin-top:16px;padding-left:4px;text-transform:uppercase;letter-spacing:.06em}

/* STANDARD CARD */
.std-card{background:#fff;border:1px solid #e5e7eb;border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.std-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.std-card-header{display:flex;align-items:flex-start;gap:12px;padding:14px 16px}
.std-code{font-size:.78rem;font-weight:700;white-space:nowrap;padding:3px 9px;border-radius:6px;color:#fff;flex-shrink:0;margin-top:1px;letter-spacing:.02em}
.std-desc{font-size:.9rem;color:var(--text);flex:1;line-height:1.5}
.std-expand{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:5px;flex-shrink:0;transition:all .15s;margin-top:0}
.std-expand:hover{color:var(--text);background:#f3f4f6}
.std-expand svg{transition:transform .2s}
.std-expand.open svg{transform:rotate(180deg)}

/* NCTM ROW */
.nctm-row{background:#fffbeb;border-top:1px solid #fde68a;padding:9px 16px 9px 40px;display:flex;align-items:flex-start;gap:8px}
.nctm-badge{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#92400e;background:#fef3c7;border:1px solid #fde68a;padding:2px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.nctm-text{font-size:.82rem;color:#78350f;line-height:1.45}

/* STATE ROWS */
.state-rows{border-top:1px solid #f3f4f6}
.state-row{display:flex;align-items:flex-start;gap:10px;padding:9px 16px 9px 40px;border-top:1px solid #f9fafb;transition:background .1s}
.state-row:hover{background:#f9fafb}
.state-label{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;color:#fff;flex-shrink:0;width:34px;text-align:center;margin-top:1px}
.state-label.FL{background:var(--FL)}
.state-label.TX{background:var(--TX)}
.state-label.CA{background:var(--CA)}
.state-label.NY{background:var(--NY)}
.state-codes{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.state-std{display:flex;align-items:flex-start;gap:6px}
.s-code{font-size:.78rem;font-weight:700;color:var(--text);white-space:nowrap;background:#f3f4f6;padding:1px 7px;border-radius:4px;flex-shrink:0;margin-top:1px}
.s-desc{font-size:.82rem;color:var(--muted);line-height:1.4}
.s-sep{color:#d1d5db;font-size:.8rem;padding-top:1px}
.no-match{font-size:.82rem;color:var(--muted);font-style:italic}

/* HIGHLIGHT */
mark{background:#fef9c3;border-radius:2px;padding:0 1px}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{font-size:1.1rem;margin-bottom:8px;color:var(--text)}

/* DISCLAIMER */
.disclaimer{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:.8rem;color:#1e40af;display:flex;gap:8px;align-items:flex-start}
.disclaimer svg{flex-shrink:0;margin-top:1px}

@media(max-width:700px){
  .sidebar{display:none}
  .controls{top:53px;gap:8px}
  .state-toggles{margin-left:0}
}
</style>
</head>

<div class="page">

// ─── APP ────────────────────────────────────────────────────────────────────
let activeGrade = "all";
let activeStates = new Set(["FL","TX","CA","NY"]);
let searchQuery = "";

function esc(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(str, q){
  if(!q) return esc(str);
  const re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return esc(str).replace(re,"<mark>$1</mark>");
}

function getDomainColor(d){return DOMAIN_COLORS[d]||"#6b7280"}
function getDomainName(d){return DOMAIN_NAMES[d]||d}

function getVisibleStandards(){
  const q = searchQuery.toLowerCase().trim();
  return S.filter(s=>{
    if(activeGrade !== "all" && s.g !== parseInt(activeGrade)) return false;
    if(!q) return true;
    return s.id.toLowerCase().includes(q) ||
           s.desc.toLowerCase().includes(q) ||
           s.nctm.toLowerCase().includes(q) ||
           ["FL","TX","CA","NY"].some(st=>
             s[st].some(c=>c.c.toLowerCase().includes(q)||c.d.toLowerCase().includes(q))
           );
  });
}

function groupStandards(list){
  // group by grade → domain → cluster
  const out = {};
  list.forEach(s=>{
    const gk = s.g;
    if(!out[gk]) out[gk]={};
    const dk = s.d;
    if(!out[gk][dk]) out[gk][dk]={};
    const ck = s.cl;
    if(!out[gk][dk][ck]) out[gk][dk][ck]={name:s.clN, items:[]};
    out[gk][dk][ck].items.push(s);
  });
  return out;
}

function renderStateRow(s, state){
  if(!activeStates.has(state)) return "";
  const corrs = s[state];
  if(!corrs || !corrs.length) return `<div class="state-row"><span class="state-label ${state}">${state}</span><span class="no-match">Not directly addressed in ${state} standards at this grade level.</span></div>`;
  const q = searchQuery.toLowerCase().trim();
  const pairs = corrs.map((c,i)=>{
    const hasCode = c.c && c.c.trim();
    const codeHtml = hasCode ? `<span class="s-code">${highlight(c.c,q)}</span>` : "";
    return `<span class="state-std">${codeHtml}<span class="s-desc">${highlight(c.d,q)}</span></span>${i<corrs.length-1?'<span class="s-sep">·</span>':''}`;
  }).join("");
  return `<div class="state-row"><span class="state-label ${state}">${state}</span><div class="state-codes">${pairs}</div></div>`;
}

function renderCard(s){
  const color = getDomainColor(s.d);
  const q = searchQuery.toLowerCase().trim();
  const id = "card-"+s.id.replace(/\./g,"-");
  const stateRowsHtml = ["FL","TX","CA","NY"].map(st=>renderStateRow(s,st)).join("");
  const hasStates = activeStates.size > 0;
  // Auto-expand when searching so matching state codes are immediately visible
  const expanded = q.length > 0 && hasStates;
  return `<div class="std-card" id="${id}">
    <div class="std-card-header">
      <span class="std-code" style="background:${color}">${s.id}</span>
      <span class="std-desc">${highlight(s.desc,q)}</span>
      <button class="std-expand${expanded?' open':''}" onclick="toggleCard(this)" aria-label="Expand" ${!hasStates?'style="visibility:hidden"':''}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div class="nctm-row">
      <span class="nctm-badge">NCTM</span>
      <span class="nctm-text">${highlight(s.nctm,q)}</span>
    </div>
    <div class="state-rows" style="display:${expanded?'block':'none'}">${stateRowsHtml}</div>
  </div>`;
}

function toggleCard(btn){
  btn.classList.toggle("open");
  const stateRows = btn.closest(".std-card").querySelector(".state-rows");
  stateRows.style.display = stateRows.style.display==="none" ? "block" : "none";
}

function renderSidebar(grouped){
  const grades = Object.keys(grouped).sort();
  let html = "";
  grades.forEach(g=>{
    html += `<div class="sb-section"><div class="sb-grade">Grade ${g}</div>`;
    const domains = Object.keys(grouped[g]).sort((a,b)=>{
      const order = ["RP","NS","EE","G","SP","F"];
      return order.indexOf(a)-order.indexOf(b);
    });
    domains.forEach(d=>{
      const count = Object.values(grouped[g][d]).reduce((n,cl)=>n+cl.items.length,0);
      html += `<div class="sb-domain" onclick="scrollToDomain('${g}-${d}')" data-domain="${g}-${d}">
        <span class="sb-dot" style="background:${getDomainColor(d)}"></span>
        <span>${getDomainName(d)}</span>
        <span class="sb-count">${count}</span>
      </div>`;
    });
    html += "</div>";
  });
  document.getElementById("sidebar").innerHTML = html;
}

function scrollToDomain(key){
  const el = document.getElementById("domain-"+key);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}

function render(){
  const visible = getVisibleStandards();
  const grouped = groupStandards(visible);
  renderSidebar(grouped);

  const grades = Object.keys(grouped).sort();
  let html = "";

  if(!visible.length){
    html = `<div class="empty"><h3>No standards found</h3><p>Try a different search term or adjust your filters.</p></div>`;
    document.getElementById("main").innerHTML = html;
    document.getElementById("resultCount").textContent = "0 results";
    return;
  }

  html += `<div class="disclaimer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span>State correlations are approximate and based on publicly available standards documents. Always verify against current official state standards before using in curriculum planning.</span>
  </div>`;

  const domainOrder = ["RP","NS","EE","G","SP","F"];

  grades.forEach(g=>{
    const domains = Object.keys(grouped[g]).sort((a,b)=>domainOrder.indexOf(a)-domainOrder.indexOf(b));
    domains.forEach(d=>{
      const color = getDomainColor(d);
      html += `<div class="domain-section" id="domain-${g}-${d}">
        <div class="domain-header">
          <span class="domain-dot" style="background:${color}"></span>
          <span class="domain-name">${getDomainName(d)}</span>
          <span class="domain-grade">Grade ${g}</span>
        </div>`;
      const clusters = grouped[g][d];
      Object.keys(clusters).sort().forEach(ck=>{
        const cl = clusters[ck];
        html += `<div class="cluster-label">${cl.name}</div>`;
        cl.items.forEach(s=>{html += renderCard(s)});
      });
      html += `</div>`;
    });
  });

  document.getElementById("main").innerHTML = html;
  document.getElementById("resultCount").textContent = visible.length+" standard"+(visible.length!==1?"s":"");

  // Sync expand-all button label: if search is active, cards start expanded
  _allExpanded = searchQuery.trim().length > 0;
  document.getElementById("expandAllBtn").textContent = _allExpanded ? "Collapse All" : "Expand All";

  // highlight active sidebar domain on scroll
  observeDomains();
}

let _domainObserver = null;
function observeDomains(){
  if(_domainObserver) _domainObserver.disconnect();
  const sections = document.querySelectorAll(".domain-section");
  if(!sections.length) return;
  _domainObserver = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll(".sb-domain").forEach(el=>el.classList.remove("active"));
        const key = e.target.id.replace("domain-","");
        const sb = document.querySelector(`.sb-domain[data-domain="${key}"]`);
        if(sb) sb.classList.add("active");
      }
    });
  },{rootMargin:"-20% 0px -70% 0px"});
  sections.forEach(s=>_domainObserver.observe(s));
}

let _allExpanded = false;
function toggleAllCards(){
  _allExpanded = !_allExpanded;
  document.querySelectorAll(".state-rows").forEach(el=>{
    el.style.display = _allExpanded ? "block" : "none";
  });
  document.querySelectorAll(".std-expand").forEach(btn=>{
    btn.classList.toggle("open", _allExpanded);
  });
  document.getElementById("expandAllBtn").textContent = _allExpanded ? "Collapse All" : "Expand All";
}

// ─── EVENT HANDLERS ──────────────────────────────────────────────────────────
document.getElementById("searchInput").addEventListener("input",e=>{
  searchQuery = e.target.value;
  render();
});

document.getElementById("gradePills").querySelectorAll(".pill").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    activeGrade = btn.dataset.grade;
    render();
  });
});

document.getElementById("stateToggles").querySelectorAll(".state-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const st = btn.dataset.state;
    if(activeStates.has(st)){
      if(activeStates.size===1) return; // keep at least one
      activeStates.delete(st);
      btn.classList.remove("active");
    } else {
      activeStates.add(st);
      btn.classList.add("active");
    }
    render();
  });
});

render();

</script>
</body>
</html>
